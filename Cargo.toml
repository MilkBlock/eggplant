[package]
name = "eggplant"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true

[features]
default = ["viewer"]
viewer = ["eggplant-viewer", "dep:eframe"]

[dependencies]
derive_more = { version = "2.0.1", features = [
    "deref_mut",
    "deref",
    "into_iterator",
    "debug",
] }
smallvec = "1.15.1"
symbol_table = { version = "0.4.0", features = ["global"] }
inventory = "0.3.20"
petgraph = "0.6.5"
dashmap = "6.1.0"
env_logger = "0.11.8"
log = "0.4.27"
eggplant-macros.workspace = true
eggplant-viewer = { workspace = true, optional = true }
eggplant-egui_graphs = { workspace = true, optional = true }
eframe = { workspace = true, optional = true }
egglog.workspace = true
strum = { version = "0.27.2", features = ["strum_macros"] }
strum_macros = "0.27.2"
graphviz-rust = "0.9.5"
serde.workspace = true
serde_json.workspace = true

[[bin]]
name = "viewer_example"
path = "src/viewer_example.rs"
required-features = ["viewer"]

[workspace]
members = ["eggplant-macros", "eggplant-transpiler", "eggplant-egui_graphs"]
resolver = "2"                                                               # recommended 2021 Edition

[workspace.package]
edition = "2024"
version = "0.2.7"
description = "eggplant is a High-Level Rust API crate for Egglog"
repository = "https://github.com/MilkBlock/eggplant"
keywords = ["e-graphs", "egglog", "datalog", "compiler", "equality"]
license = "MIT"
readme = "README.md"
authors = ["MilkBlock"]

[workspace.dependencies]
eggplant-macros = { path = "eggplant-macros", version = "0.2.7" }
eggplant-viewer = { path = "eggplant-viewer" }
eggplant-egui_graphs = { path = "eggplant-egui_graphs" }
eggplant-transpiler = { path = "eggplant-transpiler", version = "0.2.7" }
egglog = { path = "../stable/serialize_raw" }
itertools = "0.14.0"
indexmap = { version = "2.12.0", features = ["serde"] }

serde = "1.0.224"
serde_json = "1.0.145"
egui = { version = "0.32", features = ["serde"] }
rand = "0.9"
petgraph = { version = "0.8", features = ["serde-1"] }
instant = "0.1"
crossbeam = "0.8"
eframe = "0.32"
ureq = "2.10"
criterion = { version = "0.5", features = ["html_reports"] }
